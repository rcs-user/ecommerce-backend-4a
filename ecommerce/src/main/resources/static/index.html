<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToAqui - Transporte Escolar</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #17233c;
      background: #eef3f8;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f5f78, #1d8aa4 55%, #dbeef1);
    }
    .login-card {
      width: min(430px, calc(100% - 32px));
      padding: 32px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 20px 50px rgba(15, 95, 120, .22);
    }
    .brand {
      margin: 0 0 6px;
      color: #0f5f78;
      font-size: 36px;
      letter-spacing: -1px;
    }
    .subtitle {
      margin: 0 0 24px;
      color: #64748b;
    }
    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 14px;
      font-weight: 700;
    }
    select, input {
      width: 100%;
      height: 48px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 0 13px;
      background: white;
      color: #17233c;
      font: inherit;
    }
    button {
      width: 100%;
      height: 48px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background: #0f738f;
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: #0b627a; }
    button:disabled { cursor: wait; opacity: .65; }
    .error {
      min-height: 20px;
      margin: 12px 0 0;
      color: #b91c1c;
      font-size: 14px;
    }
    .profile { display: none; }
    .profile.active { display: block; }
    .profile h2 { margin: 0 0 8px; }
    .profile p { color: #64748b; }
    .profile button {
      margin-top: 16px;
      background: #334155;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <section id="login-view">
      <h1 class="brand">ToAqui</h1>
      <p class="subtitle">Transporte escolar seguro e acompanhado</p>

      <form id="login-form">
        <label for="profile">Tipo de acesso</label>
        <select id="profile" name="profile">
          <option value="rcs4">Administrador</option>
          <option value="rcs2">Monitor</option>
          <option value="rcs1">Responsável</option>
          <option value="rcs3">Aluno</option>
        </select>

        <label for="username">Usuário</label>
        <input id="username" name="username" value="rcs4" autocomplete="username" required>

        <label for="password">Senha</label>
        <input id="password" name="password" type="password" value="1234" autocomplete="current-password" required>

        <button id="login-button" type="submit">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="logged-view" class="profile">
      <h2 id="welcome-title"></h2>
      <p id="welcome-description"></p>
      <button id="logout-button" type="button">Sair</button>
    </section>
  </main>

  <script>
    const profileConfig = {
      rcs4: { name: "Administrador", description: "Acesso à gestão operacional completa." },
      rcs2: { name: "Monitor", description: "Acesso às viagens e registro de presença." },
      rcs1: { name: "Responsável", description: "Acesso à consulta e acompanhamento dos registros." },
      rcs3: { name: "Aluno", description: "Acesso à consulta de viagens e informações públicas." }
    };

    const form = document.getElementById("login-form");
    const profileSelect = document.getElementById("profile");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const errorText = document.getElementById("login-error");
    const loginButton = document.getElementById("login-button");

    profileSelect.addEventListener("change", () => {
      const selected = profileSelect.value;
      usernameInput.value = selected;
      passwordInput.value = "1234";
    });

    function showLoggedProfile(username) {
      const profile = profileConfig[username] || { name: "Usuário", description: "Autenticação realizada." };
      document.getElementById("login-view").style.display = "none";
      document.getElementById("logged-view").classList.add("active");
      document.getElementById("welcome-title").textContent = profile.name;
      document.getElementById("welcome-description").textContent = profile.description;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorText.textContent = "";
      loginButton.disabled = true;
      loginButton.textContent = "Entrando...";

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const authorization = "Basic " + btoa(unescape(encodeURIComponent(username + ":" + password)));

      try {
        const response = await fetch("/api/status", {
          headers: { "Authorization": authorization },
          cache: "no-store"
        });
        if (!response.ok) {
          throw new Error(response.status === 401
            ? "Usuário ou senha inválidos."
            : "Não foi possível autenticar.");
        }
        sessionStorage.setItem("toaqui-auth", authorization);
        sessionStorage.setItem("toaqui-user", username);
        showLoggedProfile(username);
      } catch (error) {
        errorText.textContent = error.message;
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Entrar";
      }
    });

    document.getElementById("logout-button").addEventListener("click", () => {
      sessionStorage.removeItem("toaqui-auth");
      sessionStorage.removeItem("toaqui-user");
      document.getElementById("logged-view").classList.remove("active");
      document.getElementById("login-view").style.display = "block";
      passwordInput.value = "";
    });

    const savedUser = sessionStorage.getItem("toaqui-user");
    if (savedUser && sessionStorage.getItem("toaqui-auth")) {
      showLoggedProfile(savedUser);
    }
  </script>
</body>
</html>
